<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
  }

  .region-selector {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 400px;
    margin: 0 auto;
  }

  .region-option {
    padding: 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    background: white;
  }

  .region-option:hover {
    border-color: #00A5FF;
    background: #f5f5f5;
  }

  .region-option.selected {
    border-color: #00A5FF;
    background: #e3f2fd;
  }

  .region-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .region-description {
    font-size: 14px;
    color: #666;
  }

  .region-url {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
    font-family: monospace;
  }

  .error-message {
    color: #d32f2f;
    padding: 12px;
    background: #ffebee;
    border-radius: 4px;
    margin-top: 16px;
    display: none;
  }

  .info-message {
    color: #1976d2;
    padding: 12px;
    background: #e3f2fd;
    border-radius: 4px;
    margin-bottom: 16px;
    font-size: 14px;
  }
</style>

<div class="info-message">
  <strong data-i18n="pair.select_region.title">Select your Livoltek region</strong>
  <p data-i18n="pair.select_region.description">Choose the region where your Livoltek account is registered.</p>
</div>

<div class="region-selector">
  <div class="region-option" data-region="eu" onclick="selectRegion('eu')">
    <div class="region-title" data-i18n="pair.region.eu.title">Europe (EU)</div>
    <div class="region-description" data-i18n="pair.region.eu.description">For European Livoltek accounts</div>
    <div class="region-url">api-eu.livoltek-portal.com</div>
  </div>

  <div class="region-option" data-region="global" onclick="selectRegion('global')">
    <div class="region-title" data-i18n="pair.region.global.title">Global</div>
    <div class="region-description" data-i18n="pair.region.global.description">For all other regions</div>
    <div class="region-url">api.livoltek-portal.com</div>
  </div>
</div>

<div class="error-message" id="error"></div>

<script>
  let selectedRegion = null;

  function selectRegion(region) {
    selectedRegion = region;

    // Update UI
    document.querySelectorAll('.region-option').forEach(option => {
      option.classList.remove('selected');
    });
    document.querySelector(`[data-region="${region}"]`).classList.add('selected');

    // Clear error
    document.getElementById('error').style.display = 'none';

    // Notify Homey and proceed to next step
    Homey.emit('region_selected', { region: region }).then(() => {
      console.log('UI: Region selected successfully');
      Homey.nextView();
    }).catch((err) => {
      showError(err);
    });
  }

  function showError(message) {
    const errorDiv = document.getElementById('error');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
  }

  // Pre-select EU region as default
  document.addEventListener('DOMContentLoaded', () => {
    // EU is more common, pre-select it visually (but don't save yet)
    document.querySelector('[data-region="eu"]').classList.add('selected');
  });
</script>
